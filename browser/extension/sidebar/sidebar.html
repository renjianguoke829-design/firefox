<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>控制台侧边栏</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #111827; color: #f3f4f6; }
      .wrap { padding: 12px; display: grid; gap: 12px; }
      .card { border: 1px solid #374151; border-radius: 8px; padding: 10px; background: #1f2937; }
      .label { font-size: 12px; color: #9ca3af; margin-bottom: 6px; }
      .value { font-size: 14px; font-weight: 600; }
      textarea { width: 100%; min-height: 90px; resize: vertical; border-radius: 6px; border: 1px solid #4b5563; background: #111827; color: #f9fafb; padding: 8px; box-sizing: border-box; }
      button { border: 1px solid #4b5563; background: #2563eb; color: #fff; border-radius: 6px; padding: 8px 10px; cursor: pointer; }
      button.alt { background: #374151; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      pre { white-space: pre-wrap; word-break: break-word; margin: 0; max-height: 220px; overflow: auto; }
      .switch { display: flex; align-items: center; gap: 8px; font-size: 13px; }
      .hint { font-size: 12px; color: #9ca3af; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="card">
        <div class="label">流水线状态</div>
        <div class="value" id="stage">当前工序：未开始</div>
        <div class="value" id="progress">进度：0/0</div>
        <div class="hint" id="platform">平台：unknown</div>
      </section>

      <section class="card">
        <div class="label">项目切换</div>
        <div class="row">
          <button id="modeMarxist">马列框架</button>
          <button id="modeBlank" class="alt">空白对照</button>
        </div>
      </section>

      <section class="card">
        <div class="label">指令输入</div>
        <textarea id="prompt" placeholder="输入指令后发送到当前AI页面"></textarea>
        <div class="row" style="margin-top: 8px;">
          <button id="sendPrompt">发送指令</button>
          <button id="syncStage" class="alt">刷新状态</button>
        </div>
      </section>

      <section class="card">
        <label class="switch">
          <input type="checkbox" id="recording" />
          <span>数据记录开关（记录AI对话）</span>
        </label>
      </section>


      <section class="card">
        <div class="label">数据导出</div>
        <div class="row">
          <button id="exportJson" class="alt">导出JSON</button>
        </div>
      </section>

      <section class="card">
        <div class="label">输出显示</div>
        <pre id="output">暂无输出</pre>
      </section>
    </div>
    <script src="sidebar.js"></script>
  </body>
</html>
